{% extends "layout.html" %}
{% block content %}
<h1>Settings</h1>
<div class="card" style="max-width:500px">
    <h2>Change Password</h2>
    {% if saved %}<div class="success">Password updated.</div>{% endif %}
    {% match error %}{% when Some with (e) %}<div class="error">{{ e }}</div>{% when None %}{% endmatch %}
    <form method="post">
        <label for="current_password">Current Password</label>
        <input type="password" name="current_password" id="current_password" required>
        <label for="new_password">New Password (min 8 chars)</label>
        <input type="password" name="new_password" id="new_password" minlength="8" required>
        <button type="submit">Update Password</button>
    </form>
</div>
{% endblock %}
